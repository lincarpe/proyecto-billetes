[project]
name = "proyecto-billetes"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.54.0",
